name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check taskmesh tests

      - name: Type check (mypy)
        run: mypy taskmesh

      - name: Migrations apply cleanly on empty database
        env:
          TASKMESH_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskmesh
        run: alembic upgrade head

      - name: Tests (unit + integration against real services)
        env:
          TASKMESH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskmesh
          TASKMESH_TEST_REDIS_URL: redis://localhost:6379/1
        run: python -m pytest tests -v
